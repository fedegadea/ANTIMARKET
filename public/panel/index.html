<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de marca — Anti Market</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .tabs { display: flex; gap: var(--space-2); border-bottom: var(--border); margin-block: var(--space-4); flex-wrap: wrap; }
    .tabs button { padding: 0.6rem 1rem; font-size: var(--text-sm); color: var(--muted); border-bottom: 2px solid transparent; }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
    .kpis { display: grid; gap: var(--space-3); grid-template-columns: repeat(2, 1fr); margin-bottom: var(--space-4); }
    @media (min-width: 700px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
    .kpi { border: var(--border); border-radius: var(--radius); background: #fff; padding: var(--space-3); }
    .kpi .v { font-family: var(--font-display); font-size: var(--text-xl); font-variant-numeric: tabular-nums; }
    .kpi .l { font-size: var(--text-xs); color: var(--muted); }
    .headline { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: var(--space-3); }
    table { width: 100%; border-collapse: collapse; font-size: var(--text-sm); background: #fff; border: var(--border); }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: var(--border); }
    th { font-size: var(--text-xs); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
    td.num { font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; }
    .badge { font-size: var(--text-xs); border: var(--border); border-radius: 999px; padding: 0.1rem 0.6rem; }
    .badge--paid { color: var(--accent); border-color: var(--accent); }
    .badge--overdue { color: var(--danger); border-color: var(--danger); }
    .chart-box { border: var(--border); border-radius: var(--radius); background: #fff; padding: var(--space-3); margin-bottom: var(--space-4); }
    .edit-box { border: var(--border); border-radius: var(--radius); background: #fff; padding: var(--space-3); margin-top: var(--space-3); }
    .edit-box input, .edit-box textarea, .edit-box select { border: var(--border); border-radius: var(--radius); padding: 0.4rem 0.5rem; font: inherit; }
    .linklike { color: var(--accent); text-decoration: underline; cursor: pointer; background: none; border: 0; font: inherit; padding: 0; }
    .seg { display: inline-flex; border: var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg-btn { padding: 0.5rem 1rem; font-size: var(--text-sm); background: #fff; color: var(--muted); border: 0; cursor: pointer; }
    .seg-btn.is-active { background: var(--accent); color: var(--accent-ink); }
    .prod-picker { max-height: 260px; overflow-y: auto; border: var(--border); border-radius: var(--radius); background: #fff; padding: 0.4rem; margin-bottom: var(--space-2); }
    .prod-opt { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.5rem; font-size: var(--text-sm); border-radius: var(--radius); cursor: pointer; }
    .prod-opt:hover { background: var(--bg); }
    .prod-opt input { width: auto; }
    .chart-row { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); padding: 0.5rem 0; border-bottom: var(--border); font-size: var(--text-sm); }
    h4 { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .outlet-list { display: grid; gap: 0.3rem; }
    .outlet-row { display: flex; align-items: center; gap: var(--space-2); padding: 0.5rem; border: var(--border); border-radius: var(--radius); background: #fff; cursor: pointer; }
    .outlet-row input { width: auto; }
    .outlet-thumb { width: 40px; height: 50px; object-fit: cover; border-radius: 4px; background: #F1F0EC; flex: none; }
    .outlet-name { flex: 1; font-size: var(--text-sm); }
    .outlet-price { display: flex; gap: 0.4rem; align-items: baseline; font-size: var(--text-sm); white-space: nowrap; }
    .outlet-price .promo { color: var(--accent); }
    .outlet-price .was { color: var(--muted); text-decoration: line-through; font-size: var(--text-xs); }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Anti Market<span class="counter counter-mark">panel</span></a>
      <nav class="site-nav"><button data-logout hidden>Salir</button></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <section data-login hidden>
        <h1>Panel de marca</h1>
        <p class="muted" style="margin-block: var(--space-3)">Entrá con el email de contacto de tu tienda y tu contraseña.</p>
        <form class="form-grid" data-login-form>
          <label>Email
            <input name="email" type="email" required autocomplete="email">
          </label>
          <label>Contraseña
            <input name="password" type="password" required minlength="6" autocomplete="current-password">
          </label>
          <button class="btn" type="submit">Ingresar</button>
          <p data-login-msg role="status"></p>
          <p class="muted" style="font-size: var(--text-sm)">
            <a href="#" data-forgot>Olvidé mi contraseña</a> &nbsp;·&nbsp;
            <a href="#" data-register>Primera vez / crear contraseña</a>
          </p>
        </form>
      </section>

      <section data-recovery hidden>
        <h1>Nueva contraseña</h1>
        <p class="muted" style="margin-block: var(--space-3)">Elegí tu nueva contraseña para el panel.</p>
        <form class="form-grid" data-recovery-form>
          <label>Nueva contraseña
            <input name="password" type="password" required minlength="6" autocomplete="new-password">
          </label>
          <button class="btn" type="submit">Guardar contraseña</button>
          <p data-recovery-msg role="status"></p>
        </form>
      </section>

      <section data-app hidden>
        <h1 data-store-name></h1>
        <div class="tabs" role="tablist">
          <button role="tab" aria-selected="true" data-tab="resumen">Resumen</button>
          <button role="tab" aria-selected="false" data-tab="ordenes">Órdenes atribuidas</button>
          <button role="tab" aria-selected="false" data-tab="talles">Tablas de talle</button>
          <button role="tab" aria-selected="false" data-tab="outlet">Outlet</button>
          <button role="tab" aria-selected="false" data-tab="envios">Envíos</button>
          <button role="tab" aria-selected="false" data-tab="liquidaciones">Liquidaciones</button>
        </div>
        <div data-view></div>
      </section>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script type="module" src="/js/panel.js"></script>
</body>
</html>
