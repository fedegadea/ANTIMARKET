<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto — Anti Market</title>
  <meta name="description" content="Ficha de producto en Anti Market, con stock real de la marca.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body data-page="producto">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Anti Market<span class="counter counter-mark"><span data-brand-count>—</span>/30</span></a>
      <nav class="site-nav" aria-label="Principal">
        <a href="/categoria">Explorar</a>
        <a href="/manifiesto">Manifiesto</a>
        <a href="/para-marcas">Para marcas</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div class="product-layout">
        <div class="gallery" data-gallery></div>
        <div data-product-info>
          <h1 data-product-name></h1>
          <div class="product-price price" data-product-price></div>
          <div class="variant-picker" data-variant-picker aria-label="Elegí talle y color"></div>
          <button class="btn" data-add-to-cart style="width:100%">Agregar al carrito</button>
          <button class="btn btn--ghost" data-ask-agent style="width:100%; margin-top: var(--space-2)">Preguntale a tu asesora</button>
          <p class="product-desc" data-product-desc></p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="/manifiesto">Manifiesto</a>
      <a href="/como-funciona">Cómo funciona</a>
      <a href="/para-marcas">Para marcas</a>
      <a href="/politicas">Políticas</a>
      <a href="https://instagram.com/antimarket" target="_blank" rel="noopener">Instagram</a>
      <span class="sig">Anti Market — Buenos Aires, Argentina · <span class="counter-mark"><span data-brand-count>—</span>/30</span></span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/shopping.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/agent-widget.js"></script>
</body>
</html>
