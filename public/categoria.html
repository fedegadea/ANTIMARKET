<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorar — Anti Market</title>
  <meta name="description" content="Buscá entre las marcas de Anti Market: categoría, talle, marca y precio. Todo con stock real.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <link rel="icon" href="/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Anti Market">
</head>
<body data-page="categoria">
  <header class="site-header">
    <div class="container">
      <a class="logo" href="/">Anti Market</a>
      <nav class="site-nav" aria-label="Principal">
        <a href="/categoria">Explorar</a>
        <a href="/outlet">Outlet</a>
        <a href="/manifiesto">Manifiesto</a>
        <a href="/para-marcas">Para marcas</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="container">
      <h1>Explorar</h1>
      <section class="section">
        <div class="ai-search" data-ai-search>
          <div class="ai-search-inner">
            <span class="ai-spark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M18 6l-2 2M8 16l-2 2"/></svg>
            </span>
            <input data-filter-q type="search" autocomplete="off"
                   placeholder="Contale qué buscás…" aria-label="Buscar">
            <button class="ai-go" type="button" data-ai-go aria-label="Buscar">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
            </button>
          </div>
        </div>
        <div class="ai-row">
          <label class="ai-toggle" title="Activá la búsqueda con IA o la búsqueda normal">
            <input type="checkbox" data-ai-toggle checked>
            <span class="ai-toggle-track"><span class="ai-toggle-knob"></span></span>
            <span class="ai-toggle-label" data-ai-toggle-label>Búsqueda con IA</span>
          </label>
          <p class="ai-hint">Contale la ocasión, el estilo y tu presupuesto — te encontramos lo tuyo.</p>
        </div>
        <div class="ai-summary" data-ai-summary hidden></div>
        <button type="button" class="filters-toggle" data-filters-toggle>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span>Filtros</span><span class="filters-count" data-filters-count hidden></span>
        </button>
        <div class="filters-backdrop" data-filters-backdrop hidden></div>
        <div class="filters" data-filters>
          <div class="filters-head"><b>Filtrar y ordenar</b><button type="button" class="filters-close" data-filters-close aria-label="Cerrar">×</button></div>
          <select data-filter-cat aria-label="Filtrar por categoría"></select>
          <select data-filter-sub aria-label="Filtrar por subcategoría"></select>
          <div class="ms" data-filter-talle></div>
          <select data-filter-provincia aria-label="Tu provincia"></select>
          <select data-filter-envio aria-label="Filtrar por demora de envío">
            <option value="">Cuándo lo recibís</option>
            <option value="1">Recibís en 24 hs</option>
            <option value="2">Recibís en 48 hs</option>
            <option value="5">Recibís en menos de 5 días</option>
            <option value="7">Recibís en menos de 7 días</option>
            <option value="10">Recibís en menos de 10 días</option>
          </select>
          <select data-filter-marca aria-label="Filtrar por marca"></select>
          <select data-filter-order aria-label="Ordenar">
            <option value="">Novedades</option>
            <option value="precio_asc">Precio: menor a mayor</option>
            <option value="precio_desc">Precio: mayor a menor</option>
          </select>
          <div class="filters-price">
            <input data-filter-min type="number" inputmode="numeric" min="0" placeholder="$ mín" aria-label="Precio mínimo">
            <input data-filter-max type="number" inputmode="numeric" min="0" placeholder="$ máx" aria-label="Precio máximo">
          </div>
          <button type="button" class="btn filters-apply" data-filters-apply>Ver resultados</button>
        </div>
        <div class="grid" data-products-grid></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <a href="/manifiesto">Manifiesto</a>
      <a href="/como-funciona">Cómo funciona</a>
      <a href="/para-marcas">Para marcas</a>
      <a href="/politicas">Políticas</a>
      <a href="/panel">Panel de marca</a>
      <a href="https://instagram.com/antimarket" target="_blank" rel="noopener">Instagram</a>
      <span class="sig">Anti Market — Buenos Aires, Argentina</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/account.js"></script>
  <script src="/js/tour.js"></script>
  <script src="/js/shopping.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/agent-widget.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
